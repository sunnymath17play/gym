  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<div id="gate">
  <div class="box">
    <h1>健身記帳</h1>
    <p id="gateText">這是私人紀錄，請先用 Google 帳號登入。</p>
    <button id="gateLogin">用 Google 帳號登入</button>
    <button id="gateSwitch" class="sub" hidden>換一個帳號</button>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>
<div id="root"></div>
<script>
// ===== 登入與資料庫（Firebase 專案 winnie-bloodsugar，集合 gym）=====
// 只有資料庫規則名單內的 Google 帳號能讀寫；這裡只負責畫面。
(function(){
  var CFG = {
    apiKey: "AIzaSyDp7ejbILsLaNDIyCZD3E7vpp-jk1N6B7A",
    authDomain: "winnie-bloodsugar.firebaseapp.com",
    projectId: "winnie-bloodsugar",
    storageBucket: "winnie-bloodsugar.firebasestorage.app",
    messagingSenderId: "202532680251",
    appId: "1:202532680251:web:2b6f62ecc4146f67d8e21e"
  };
  function $(id){return document.getElementById(id);}
  window.GYM = {db:null, auth:null, user:null, started:false};
  function showGate(text,msg,sw){
    $("gate").hidden=false; $("gateText").textContent=text||"這是私人紀錄，請先用 Google 帳號登入。";
    $("gateMsg").textContent=msg||""; $("gateLogin").hidden=!!sw; $("gateSwitch").hidden=!sw;
  }
  window.GYM.showGate=showGate;
  function login(){
    if(!GYM.auth){ $("gateMsg").textContent="連不上網路，請稍後再試"; return; }
    if(/Line\//i.test(navigator.userAgent)){ $("gateMsg").textContent="LINE 裡面不能用 Google 登入，請用 Safari 或 Chrome 開"; return; }
    var p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    GYM.auth.signInWithPopup(p).catch(function(e){ if(e&&e.code!=="auth/popup-closed-by-user") $("gateMsg").textContent="登入失敗："+(e.code||e.message); });
  }
  $("gateLogin").addEventListener("click",login);
  $("gateSwitch").addEventListener("click",function(){ GYM.auth.signOut().then(function(){ location.reload(); }); });
  try{
    firebase.initializeApp(CFG);
    GYM.db=firebase.firestore(); GYM.auth=firebase.auth();
    try{ GYM.db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
    GYM.auth.onAuthStateChanged(function(u){
      GYM.user=u||null;
      if(!u){ showGate(); return; }
      // 先確認這個帳號有權限，再開畫面
      GYM.db.collection("gym").doc("state").get().then(function(){
        GYM.ok=true; $("gate").hidden=true;
        if(!GYM.started && window.__startApp){ GYM.started=true; window.__startApp(); }
      }).catch(function(e){
        if(e&&e.code==="permission-denied") showGate("這個 Google 帳號（"+u.email+"）沒有權限。","請換成 SUNNY 或 Winnie 的帳號。",true);
        else { GYM.ok=true; $("gate").hidden=true; if(!GYM.started && window.__startApp){ GYM.started=true; window.__startApp(); } }
      });
    });
  }catch(e){ showGate("連不上網路，請稍後再試。"); }
})();
</script>

<script type="text/babel">
const { useState, useEffect } = React;
const DATA_KEY = "gymData";
const POINTS_SW = 1.5;
const POINTS_W = 1.0;
const POINTS_MY = 1.0;
const TODAY = new Date().toISOString().split("T")[0];
const defaultData = { points: 35, sessions: [], payments: [], purchases: [] };

function getMeiyuFee(date, purchases) {
  // 找出在 date 當天或之前最近一次的購課紀錄，取其 planId 對應的 meiyuFee
  const allPurchases = [...DEFAULT_PURCHASES, ...(purchases || [])];
  const valid = allPurchases
    .filter(p => p.planId && p.date <= date)
    .sort((a, b) => b.date.localeCompare(a.date));
  if (valid.length === 0) return 1450; // fallback
  const plan = PLANS.find(p => p.id === valid[0].planId);
  return plan ? plan.meiyuFee : 1450;
}
function stateDoc(){ return window.GYM.db.collection("gym").doc("state"); }
async function fetchData() {
  // 讀不到就丟錯，不可以用空資料頂替（否則下一次儲存會把雲端資料蓋掉）
  // 2026-09-27 已從舊 Apps Script 搬完資料，舊後端已封存
  const snap = await stateDoc().get();
  if (!snap.exists) throw new Error("雲端找不到健身資料");
  return JSON.parse(snap.data().value);
}
async function pushData(d) {
  try {
    await stateDoc().set({ value: JSON.stringify(d), updatedAt: new Date().toISOString(), by: window.GYM.user.email });
  } catch(e) { alert("儲存失敗（" + (e.code||e.message) + "），請重新整理後再試"); }
}
function fmt(ds) { return new Date(ds+"T00:00:00").toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"}); }
function fmtMonth(ds) { return new Date(ds+"T00:00:00").toLocaleDateString("zh-TW",{year:"numeric",month:"long"}); }
function r1(n) { return Math.round(n*10)/10; }
function calcPts(sw,w,my) { return (sw?POINTS_SW:0)+(w?POINTS_W:0)+(my?POINTS_MY:0); }
function getMonth(ds) { return ds.slice(0,7); }

function App() {
  const [data,setData]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [tab,setTab]=useState("dash");
  const [modal,setModal]=useState(null);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [newDate,setNewDate]=useState(TODAY);
  const [newTime,setNewTime]=useState("");
  const [newSW,setNewSW]=useState(true);
  const [newW,setNewW]=useState(false);
  const [newMY,setNewMY]=useState(true);
  const [payAmt,setPayAmt]=useState("");
  const [ptsAmt,setPtsAmt]=useState("");
  const [ptsDate,setPtsDate]=useState(TODAY);
  const [ptsMoney,setPtsMoney]=useState("");
  const [ptsNote,setPtsNote]=useState("");
  const [ptsPlan,setPtsPlan]=useState("");
  const [filterMonth,setFilterMonth]=useState("all");
  const [toast,setToast]=useState(null);

  useEffect(()=>{ setSyncing(true); fetchData().then(d=>{setData(d);setSyncing(false);}).catch(e=>{setSyncing(false);alert("讀取失敗："+(e.code||e.message)+"\n請重新整理再試，資料沒有被改動。");}); },[]);

  function upd(fn){ setData(prev=>{ const next=fn(prev); pushData(next); return next; }); }
  function notify(msg,err){ setToast({msg,err}); setTimeout(()=>setToast(null),2500); }
  function reload(){ setSyncing(true); notify("🔄 同步中…"); fetchData().then(d=>{setData(d);setSyncing(false);notify("✅ 已同步最新資料");}).catch(e=>{setSyncing(false);notify("⚠️ 同步失敗，請稍後再試");}); }

  if(!data) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:20,background:"#fdf6ee"}}>

    </div>

  const grouped=filteredSessions.reduce((acc,s)=>{ const m=getMonth(s.date); if(!acc[m])acc[m]=[]; acc[m].push(s); return acc; },{});
  const months=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
  const totalPurchased=(data.purchases||[]).reduce((a,p)=>a+p.points,0);
  const purchaseCount=(data.purchases||[]).length;

  function openAddSession(){ setNewDate(TODAY);setNewTime("");setNewSW(true);setNewW(false);setNewMY(true);setModal("sess"); }
  function addSession(){
    if(!newSW&&!newW&&!newMY) return notify("請至少勾選一項",true);
    const pts=calcPts(newSW,newW,newMY);
    const sess={id:Date.now().toString(),date:newDate,time:newTime,sw:newSW,w:newW,my:newMY,pts,meiyuPaid:false};
    upd(d=>({...d,points:r1(d.points-pts),sessions:[sess,...d.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time))}));
    setModal(null); notify("✅ 已新增・扣 "+pts+" 點");
  }
  function recordPayment(){
    const amount=parseFloat(payAmt);
    if(!amount||amount<=0) return notify("請輸入正確金額",true);
    let rem=amount;
    const sessions=[...data.sessions].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{ const fee=getMeiyuFee(s.date,data.purchases||[]); if(s.my&&!s.meiyuPaid&&rem>=fee){rem-=fee;return{...s,meiyuPaid:true};} return s; }).sort((a,b)=>b.date.localeCompare(a.date));
    upd(d=>({...d,sessions,payments:[{id:Date.now().toString(),date:TODAY,amount},...d.payments]}));
    setPayAmt(""); setModal(null); notify("💰 已記錄收款 $"+amount.toLocaleString());
  }
  function addPurchase(){
    const p=parseFloat(ptsAmt);
    if(!p||p<=0) return notify("請輸入點數",true);
    const purchase={id:Date.now().toString(),date:ptsDate,points:p,amount:ptsMoney?parseFloat(ptsMoney):null,note:ptsNote||"",planId:ptsPlan||null};
    upd(d=>({...d,points:r1(d.points+p),purchases:[purchase,...(d.purchases||[])].sort((a,b)=>b.date.localeCompare(a.date))}));
    setPtsAmt("");setPtsMoney("");setPtsNote("");setPtsPlan("");setModal(null);notify("➕ 購入 "+p+" 點");
  }
  function confirmDelete(id){ setDeleteTarget(id);setModal("delete"); }
  function delSession(){
    const s=data.sessions.find(x=>x.id===deleteTarget);
    if(!s) return;
    upd(d=>({...d,points:r1(d.points+s.pts),sessions:d.sessions.filter(x=>x.id!==deleteTarget)}));
    setDeleteTarget(null);setModal(null);notify("已刪除紀錄");
  }

  const TABS=[{id:"dash",label:"總覽",icon:"🏠"},{id:"sessions",label:"課程",icon:"📅"},{id:"payments",label:"美玉款項",icon:"💰"},{id:"purchases",label:"購課",icon:"🎫"}];

  return (
    <div style={{minHeight:"100vh",background:"#fdf6ee",color:"#3d2b1f",paddingBottom:80}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",color:"#fff",padding:"12px 26px",borderRadius:24,fontSize:15,fontWeight:600,zIndex:999,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,0.2)",background:toast.err?"#c0392b":"#27ae60"}}>{toast.msg}</div>}
      <header style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 16px 14px",background:"#fff8f0",borderBottom:"1.5px solid #f0dcc8",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:28}}>🏋️</span>
          <div><div style={{fontSize:18,fontWeight:800,color:"#5c2d00"}}>健身記帳</div><div style={{fontSize:11,color:"#b08060",letterSpacing:1.5,marginTop:1}}>SUNNY · WINNIE · 美玉</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={reload} style={{background:"none",border:"1.5px solid #e0c4a8",borderRadius:10,padding:"7px 14px",fontSize:13,color:"#b08060",cursor:"pointer",fontWeight:600}}>{syncing?"⟳ 同步中":"🔄 同步"}</button>
          <button onClick={()=>{setPtsAmt("");setPtsDate(TODAY);setPtsMoney("");setPtsNote("");setModal("pts");}} style={{background:lowPoints?"linear-gradient(135deg,#c0392b,#e74c3c)":"linear-gradient(135deg,#b85c00,#e07b1a)",border:"none",borderRadius:14,padding:"9px 16px",textAlign:"center",cursor:"pointer"}}>
            <div style={{fontSize:22,fontWeight:800,color:"#fff",lineHeight:1}}>{data.points}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.85)",marginTop:1}}>{lowPoints?"⚠️ 點數":"點數"}</div>
          </button>
        </div>
      </header>

      <div style={{padding:"16px",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column",gap:14}}>
        {tab==="dash"&&<>
          <div style={{background:"#fff",border:"1.5px solid #f5c4a0",borderLeft:"5px solid #c0392b",borderRadius:18,padding:"18px 18px 16px",boxShadow:"0 3px 14px rgba(180,80,0,0.08)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <div style={{fontSize:17,fontWeight:700,color:"#5c2d00"}}>美玉欠款</div>
                <div style={{fontSize:13,color:"#b08060",marginTop:4}}>累計上課 {mySessions.length} 堂・每堂 ${currentFee.toLocaleString()}</div>
                <div style={{fontSize:13,color:"#b08060",marginTop:2}}>{unpaid.length>0?"未付 "+unpaid.length+" 堂":"已全數結清 🎉"}</div>
              </div>
              <div style={{fontSize:36,fontWeight:800,lineHeight:1,color:owed>0?"#c0392b":"#27ae60"}}>${owed.toLocaleString()}</div>
            </div>
            {owed>0&&<button onClick={()=>{setPayAmt(String(owed));setModal("pay");}} style={{width:"100%",background:"linear-gradient(135deg,#c0392b,#e74c3c)",border:"none",borderRadius:14,padding:"14px 0",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>記錄美玉付款</button>}
          </div>

          <div style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:18,padding:"18px",boxShadow:"0 2px 10px rgba(180,120,60,0.06)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontSize:12,fontWeight:700,color:"#b08060",letterSpacing:1.5,textTransform:"uppercase"}}>點數總覽</span>
              <button onClick={()=>{setPtsAmt("");setPtsDate(TODAY);setPtsMoney("");setPtsNote("");setModal("pts");}} style={{background:"none",border:"1.5px solid #e0c4a8",color:"#b08060",borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>購入點數</button>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
              <span style={{fontSize:52,fontWeight:800,lineHeight:1,color:lowPoints?"#c0392b":"#b85c00"}}>{data.points}</span>
              <span style={{fontSize:16,color:"#b08060"}}>點剩餘</span>
            </div>
            {lowPoints&&<div style={{color:"#c0392b",fontSize:14,fontWeight:600,marginBottom:6}}>⚠️ 點數不足，請盡快購入！</div>}
            <div style={{fontSize:13,color:"#b08060",marginBottom:14}}>共已扣 {r1(data.sessions.reduce((a,s)=>a+s.pts,0))} 點・購入 {totalPurchased} 點（共 {purchaseCount} 次）</div>
            <div style={{background:"#fdf0e4",borderRadius:12,padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}}>
              <div style={{fontSize:13,color:"#8b5e3c"}}>🧑‍🤝‍🧑 Sunny &amp; Winnie　<b>−{POINTS_SW} 點</b>／堂　嚕嚕米教練</div>
              <div style={{fontSize:13,color:"#8b5e3c"}}>👩 Winnie 單獨　<b>−{POINTS_W} 點</b>／堂　嚕嚕米教練</div>
              <div style={{fontSize:13,color:"#8b5e3c"}}>🧍 美玉　<b>−{POINTS_MY} 點</b>／堂　Ray 教練・${currentFee.toLocaleString()}／堂</div>
            </div>
          </div>

          <div style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:18,padding:"16px 18px",boxShadow:"0 2px 10px rgba(180,120,60,0.06)",display:"flex",alignItems:"center",gap:16}}>
            <img src={CAT_IMG} style={{width:80,height:80,objectFit:"contain",flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:"#b08060",letterSpacing:1,marginBottom:10}}>🐱 貓貓運動紀錄</div>
              <div style={{display:"flex"}}>
                <div style={{flex:1,textAlign:"center"}}><div style={{fontSize:36,fontWeight:800,color:"#b85c00",lineHeight:1}}>{winnieTotal}</div><div style={{fontSize:12,color:"#b08060",marginTop:4}}>累計堂數</div></div>
                <div style={{width:"1.5px",background:"#f0dcc8",margin:"0 8px"}}/>
                <div style={{flex:1,textAlign:"center"}}><div style={{fontSize:36,fontWeight:800,color:"#b85c00",lineHeight:1}}>{winnieTotal}</div><div style={{fontSize:12,color:"#b08060",marginTop:4}}>共計小時</div></div>
              </div>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {[{v:data.sessions.length,l:"總課程"},{v:mySessions.length,l:"美玉課程"},{v:"$"+totalPaid.toLocaleString(),l:"累計收款"}].map(({v,l})=>(
              <div key={l} style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:14,padding:"16px 8px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800,color:"#5c2d00"}}>{v}</div>
                <div style={{fontSize:12,color:"#b08060",marginTop:4}}>{l}</div>
              </div>
            ))}
          </div>
          <button onClick={openAddSession} style={{width:"100%",background:"none",border:"2px dashed #e0c4a8",color:"#c4956a",borderRadius:14,padding:"16px 0",fontSize:16,fontWeight:600,cursor:"pointer"}}>＋ 新增課程</button>
        </>}

        {tab==="sessions"&&<>
          <div style={{display:"flex",gap:8,marginBottom:4}}>
            {[{k:"all",l:"全部"},{k:"month",l:"本月"}].map(f=>{ const active=f.k==="all"?filterMonth==="all":filterMonth===thisMonth; return <button key={f.k} onClick={()=>setFilterMonth(f.k==="all"?"all":thisMonth)} style={{background:active?"#b85c00":"#fff",border:active?"1.5px solid #b85c00":"1.5px solid #e0c4a8",color:active?"#fff":"#b08060",borderRadius:10,padding:"8px 18px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{f.l}</button>; })}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,fontWeight:700,color:"#b08060",letterSpacing:1.5,textTransform:"uppercase"}}>課程紀錄</span>
            <button onClick={openAddSession} style={{background:"none",border:"1.5px solid #e0c4a8",color:"#b08060",borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>＋ 新增</button>
          </div>
          {filteredSessions.length===0&&<div style={{textAlign:"center",color:"#c4a882",fontSize:15,padding:"40px 0"}}>尚無課程紀錄</div>}
          {months.map(m=>(
            <div key={m}>
              <div style={{fontSize:13,fontWeight:700,color:"#b08060",letterSpacing:1,padding:"10px 4px 6px"}}>{fmtMonth(m+"-01")}</div>
              {grouped[m].map(s=>{ const fee=getMeiyuFee(s.date,purchases); return (
                <div key={s.id} style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:14,padding:"16px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:16,fontWeight:700,color:"#3d2b1f"}}>{fmt(s.date)}{s.time&&<span style={{fontSize:14,fontWeight:400,color:"#b08060"}}> {s.time}</span>}</div>
                    <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                      {s.sw&&<span style={{fontSize:12,background:"#fdf0e4",borderRadius:8,padding:"3px 10px",color:"#8b5e3c",fontWeight:600}}>Sunny &amp; Winnie</span>}
                      {s.w&&<span style={{fontSize:12,background:"#f3eeff",borderRadius:8,padding:"3px 10px",color:"#7c5cbf",fontWeight:600}}>Winnie 單獨</span>}
                      {s.my&&<span style={{fontSize:12,background:"#fdecea",borderRadius:8,padding:"3px 10px",color:"#c0392b",fontWeight:600}}>美玉</span>}
                    </div>
                    <div style={{fontSize:12,color:"#c4a882",marginTop:5}}>扣 {s.pts} 點{s.my?"・美玉 $"+fee.toLocaleString():""}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                    {s.my&&<span style={{fontSize:12,fontWeight:700,borderRadius:10,padding:"5px 12px",background:s.meiyuPaid?"#eafaf1":"#fdecea",color:s.meiyuPaid?"#27ae60":"#c0392b"}}>{s.meiyuPaid?"已付":"未付"}</span>}
                    <button onClick={()=>confirmDelete(s.id)} style={{background:"none",border:"none",color:"#c4a882",fontSize:18,cursor:"pointer",padding:"4px 6px"}}>🗑</button>
                  </div>
                </div>
              ); })}
            </div>
          ))}
        </>}

        {tab==="payments"&&<>
          <div style={{background:"#fff",border:"1.5px solid #f0dcc8",borderLeft:"5px solid #c0392b",borderRadius:18,padding:"18px",marginBottom:4}}>
            <div style={{fontSize:13,fontWeight:700,color:"#b08060",letterSpacing:1,marginBottom:14}}>美玉款項統計</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
              {[{v:mySessions.length,l:"累計上課",c:"#5c2d00"},{v:unpaid.length,l:"未付堂數",c:"#c0392b"},{v:"$"+totalPaid.toLocaleString(),l:"累計收款",c:"#27ae60"}].map(({v,l,c})=>(
                <div key={l} style={{textAlign:"center",background:"#fdf6ee",borderRadius:12,padding:"12px 4px"}}>
                  <div style={{fontSize:20,fontWeight:800,color:c}}>{v}</div>
                  <div style={{fontSize:11,color:"#b08060",marginTop:4}}>{l}</div>
                </div>
              ))}
            </div>
            {owed>0&&<button onClick={()=>{setPayAmt(String(owed));setModal("pay");}} style={{width:"100%",background:"linear-gradient(135deg,#c0392b,#e74c3c)",border:"none",borderRadius:14,padding:"14px 0",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>記錄付款（欠 ${owed.toLocaleString()}）</button>}
          </div>
          <span style={{fontSize:12,fontWeight:700,color:"#b08060",letterSpacing:1.5,textTransform:"uppercase"}}>付款紀錄</span>
          {data.payments.length===0&&<div style={{textAlign:"center",color:"#c4a882",fontSize:15,padding:"40px 0"}}>尚無付款紀錄</div>}
          {data.payments.map(p=>(
            <div key={p.id} style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:14,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontSize:16,fontWeight:700,color:"#3d2b1f"}}>{fmt(p.date)}</div>
              <div style={{fontSize:20,fontWeight:800,color:"#27ae60"}}>${p.amount.toLocaleString()}</div>
            </div>
          ))}
        </>}

        {tab==="purchases"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,fontWeight:700,color:"#b08060",letterSpacing:1.5,textTransform:"uppercase"}}>購課紀錄</span>
            <button onClick={()=>{setPtsAmt("");setPtsDate(TODAY);setPtsMoney("");setPtsNote("");setPtsPlan("");setModal("pts");}} style={{background:"none",border:"1.5px solid #e0c4a8",color:"#b08060",borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>＋ 購入</button>
          </div>
          <div style={{background:"#fff8f0",border:"1.5px solid #f0dcc8",borderRadius:12,padding:"12px 16px",fontSize:14,color:"#8b5e3c"}}>共購入 <b>{totalPurchased} 點</b>・<b>{purchaseCount} 次</b></div>
          {(data.purchases||[]).length===0&&<div style={{textAlign:"center",color:"#c4a882",fontSize:15,padding:"40px 0"}}>尚無購課紀錄</div>}
          {(data.purchases||[]).map(p=>(
            <div key={p.id} style={{background:"#fff",border:"1.5px solid #f0dcc8",borderRadius:14,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div><div style={{fontSize:16,fontWeight:700,color:"#3d2b1f"}}>{fmt(p.date)}</div>{p.note&&<div style={{fontSize:13,color:"#b08060",marginTop:3}}>{p.note}</div>}</div>
              <div style={{textAlign:"right"}}><div style={{fontSize:20,fontWeight:800,color:"#b85c00"}}>+{p.points} 點</div>{p.amount&&<div style={{fontSize:13,color:"#b08060",marginTop:3}}>${p.amount.toLocaleString()}</div>}</div>
            </div>
          ))}
        </>}
      </div>

      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff8f0",borderTop:"1.5px solid #f0dcc8",display:"flex",justifyContent:"space-around",padding:"8px 0 max(12px, env(safe-area-inset-bottom))",zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 8px",flex:1}}>
            <span style={{fontSize:22}}>{t.icon}</span>
            <span style={{fontSize:11,fontWeight:600,color:tab===t.id?"#b85c00":"#b08060"}}>{t.label}</span>
            {tab===t.id&&<div style={{width:20,height:2.5,background:"#b85c00",borderRadius:2,marginTop:1}}/>}
          </button>
        ))}
      </nav>

      {modal==="sess"&&<Overlay onClose={()=>setModal(null)}>
        <div style={{fontSize:20,fontWeight:800,color:"#5c2d00",marginBottom:20}}>新增課程</div>
        <Label>上課日期</Label>
        <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={iSt}/>
        <Label>上課時間（選填）</Label>
        <input type="time" value={newTime} onChange={e=>setNewTime(e.target.value)} style={iSt}/>
        <Label>出席者（可複選）</Label>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
          <ChkCard on={newSW} onToggle={()=>setNewSW(v=>!v)} main={"Sunny & Winnie　−"+POINTS_SW+" 點"} sub="嚕嚕米教練" color="#b85c00"/>
          <ChkCard on={newW} onToggle={()=>setNewW(v=>!v)} main={"Winnie 單獨　−"+POINTS_W+" 點"} sub="嚕嚕米教練" color="#7c5cbf"/>
          <ChkCard on={newMY} onToggle={()=>setNewMY(v=>!v)} main={"美玉　−"+POINTS_MY+" 點・欠 $"+newFee.toLocaleString()} sub="Ray 教練" color="#c0392b"/>
        </div>
        <div style={{background:"#fdf0e4",borderRadius:12,padding:"12px 16px",fontSize:14,color:"#8b5e3c"}}>本次扣點：<b>{newPts} 點</b>{newMY&&<span>　美玉記欠 <b>${newFee.toLocaleString()}</b></span>}</div>
        <Btns onCancel={()=>setModal(null)} onConfirm={addSession} label="確認新增"/>
      </Overlay>}

      {modal==="pay"&&<Overlay onClose={()=>setModal(null)}>
        <div style={{fontSize:20,fontWeight:800,color:"#5c2d00",marginBottom:20}}>記錄美玉付款</div>
        <div style={{background:"#fdecea",border:"1.5px solid #f5c4c0",borderRadius:12,padding:"12px 16px",fontSize:14,color:"#c0392b",marginBottom:16}}>目前欠款：<b>${owed.toLocaleString()}</b>（{unpaid.length} 堂）</div>
        <Label>付款金額</Label>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <span style={{color:"#888",fontSize:20}}>$</span>
          <input type="number" value={payAmt} onChange={e=>setPayAmt(e.target.value)} placeholder={owed} style={{...iSt,flex:1,marginBottom:0}}/>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
          {[currentFee,currentFee*2,currentFee*3].filter(a=>a<=owed+1).map(a=><button key={a} onClick={()=>setPayAmt(String(a))} style={qSt}>${a.toLocaleString()}</button>)}
          {owed>currentFee&&<button onClick={()=>setPayAmt(String(owed))} style={{...qSt,background:"#fdecea",border:"1.5px solid #f5c4c0",color:"#c0392b"}}>全額 ${owed.toLocaleString()}</button>}
        </div>
        <Btns onCancel={()=>setModal(null)} onConfirm={recordPayment} label="確認收款"/>
      </Overlay>}

      {modal==="pts"&&<Overlay onClose={()=>setModal(null)}>
        <div style={{fontSize:20,fontWeight:800,color:"#5c2d00",marginBottom:20}}>購入課程點數</div>
        <div style={{background:"#fff8f0",border:"1.5px solid #f0dcc8",borderRadius:12,padding:"12px 16px",fontSize:14,color:"#8b5e3c",marginBottom:16}}>目前剩餘：<b>{data.points} 點</b></div>
        <Label>選擇方案（點選自動帶入）</Label>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {PLANS.map(plan=>{
            const active=ptsPlan===plan.id;
            return <button key={plan.id} onClick={()=>{ setPtsPlan(plan.id); setPtsAmt(String(plan.points)); setPtsMoney(String(plan.price)); setPtsNote(plan.label); }} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:active?"#fdf0e4":"#fff",border:active?"1.5px solid #b85c00":"1.5px solid #e0c4a8",borderRadius:12,padding:"12px 16px",cursor:"pointer",textAlign:"left"}}>
              <div><div style={{fontSize:14,fontWeight:700,color:active?"#b85c00":"#5c2d00"}}>{plan.label}　{plan.sessions}堂／{plan.points}點</div><div style={{fontSize:12,color:"#b08060",marginTop:2}}>美玉單堂 ${plan.meiyuFee.toLocaleString()}</div></div>
              <div style={{fontSize:15,fontWeight:800,color:active?"#b85c00":"#8b5e3c"}}>${plan.price.toLocaleString()}</div>
            </button>;
          })}
        </div>
        <Label>購入日期</Label>
        <input type="date" value={ptsDate} onChange={e=>setPtsDate(e.target.value)} style={iSt}/>
        <Label>購入點數</Label>
        <input type="number" value={ptsAmt} onChange={e=>setPtsAmt(e.target.value)} placeholder="例：24、48、72、100" style={iSt}/>
        <Label>付款金額（選填）</Label>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{color:"#888",fontSize:20}}>$</span>
          <input type="number" value={ptsMoney} onChange={e=>setPtsMoney(e.target.value)} placeholder="購入金額" style={{...iSt,flex:1,marginBottom:0}}/>
        </div>
        <Label>備註（選填）</Label>
        <input type="text" value={ptsNote} onChange={e=>setPtsNote(e.target.value)} placeholder="例：D方案" style={iSt}/>
        {ptsPlan&&<div style={{background:"#fdf0e4",borderRadius:12,padding:"10px 14px",fontSize:13,color:"#8b5e3c",marginBottom:4}}>選擇後：美玉費用將自動更新為 <b>${(PLANS.find(p=>p.id===ptsPlan)||{}).meiyuFee?.toLocaleString()}／堂</b></div>}
        <Btns onCancel={()=>setModal(null)} onConfirm={addPurchase} label="確認購入"/>
      </Overlay>}

      {modal==="delete"&&<Overlay onClose={()=>{setModal(null);setDeleteTarget(null);}}>
        <div style={{fontSize:20,fontWeight:800,color:"#5c2d00",marginBottom:16}}>確認刪除？</div>
        <div style={{color:"#8b5e3c",fontSize:15,marginBottom:24,lineHeight:1.7}}>刪除後將還原扣除的點數，此動作無法復原。</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>{setModal(null);setDeleteTarget(null);}} style={cSt}>取消</button>
          <button onClick={delSession} style={{...cnSt,background:"#c0392b"}}>確認刪除</button>
        </div>
      </Overlay>}
    </div>
  );
}

function Overlay({children,onClose}){ return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(60,30,10,0.45)",backdropFilter:"blur(6px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}><div onClick={e=>e.stopPropagation()} style={{background:"#fff8f0",borderTop:"1.5px solid #f0dcc8",borderRadius:"22px 22px 0 0",padding:"28px 22px 40px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>{children}</div></div>; }
function Label({children}){ return <div style={{fontSize:12,fontWeight:700,color:"#b08060",letterSpacing:1,marginBottom:8,display:"block"}}>{children}</div>; }
function ChkCard({on,onToggle,main,sub,color}){ return <button onClick={onToggle} style={{display:"flex",alignItems:"center",gap:14,background:on?color+"12":"#fff",border:on?"1.5px solid "+color+"55":"1.5px solid #e0c4a8",borderRadius:14,padding:"14px 16px",cursor:"pointer",width:"100%"}}><div style={{width:26,height:26,borderRadius:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:800,background:on?color+"22":"#fdf0e4",border:on?"2px solid "+color+"99":"2px solid #e0c4a8",color:on?color:"transparent"}}>✓</div><div style={{textAlign:"left"}}><div style={{fontSize:15,fontWeight:600,color:"#3d2b1f"}}>{main}</div><div style={{fontSize:12,color:"#b08060",marginTop:2}}>{sub}</div></div></button>; }
function Btns({onCancel,onConfirm,label}){ return <div style={{display:"flex",gap:10,marginTop:20}}><button onClick={onCancel} style={cSt}>取消</button><button onClick={onConfirm} style={cnSt}>{label}</button></div>; }

const iSt={width:"100%",background:"#fff",border:"1.5px solid #e0c4a8",borderRadius:12,padding:"13px 14px",color:"#3d2b1f",fontSize:16,outline:"none",boxSizing:"border-box",marginBottom:14,fontFamily:"inherit"};
const qSt={background:"#fff",border:"1.5px solid #e0c4a8",color:"#8b5e3c",borderRadius:10,padding:"9px 16px",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"};
const cSt={flex:1,background:"#f0dcc8",border:"none",color:"#8b5e3c",borderRadius:14,padding:"14px 0",fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"};
const cnSt={flex:2,background:"linear-gradient(135deg,#b85c00,#e07b1a)",border:"none",color:"#fff",borderRadius:14,padding:"14px 0",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"};

window.__startApp = function(){ ReactDOM.createRoot(document.getElementById("root")).render(<App/>); };
if (window.GYM && window.GYM.ok && !window.GYM.started) { window.GYM.started = true; window.__startApp(); }
</script>
</body>
</html>
